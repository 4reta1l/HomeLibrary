name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when new commits land on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Sanity check: fails loudly if the scheme isn't shared
      - name: List schemes
        run: xcodebuild -list -project HomeLibrary.xcodeproj

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeLibrary.xcodeproj \
            -scheme HomeLibrary \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
